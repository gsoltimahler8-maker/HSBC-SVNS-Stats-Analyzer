<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="theme-color" content="#111827" />
    <title>Offline | SVNS Stats Analyzer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #020617;
        color: #e2e8f0;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(circle at top, #2e1065 0, transparent 42%),
          #020617;
      }

      main {
        width: min(560px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.92);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.7;
      }

      button {
        margin-top: 18px;
        padding: 10px 14px;
        border: 1px solid #c4b5fd;
        border-radius: 999px;
        background: #6d28d9;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>オフラインです</h1>
      <p>
        このページはまだ端末へ保存されていません。
        通信が回復した後にSVNS Stats Analyzerを一度開くと、
        読み込み済みの画面をオフラインでも再表示できます。
      </p>
      <button type="button" onclick="window.location.reload()">
        再読み込み
      </button>
    </main>
  </body>
</html>
