name: Rugby Raw Fixture Index 2017-2026
on:
  push:
    branches: [probe/rugby-raw-backfill]
    paths:
      - scripts/diagnostics/rugby_raw_fixture_index_graphql.mjs
      - .github/workflows/rugby-raw-fixture-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe/rugby-raw-backfill}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build raw acquisition fixture index
        shell: bash
        run: |
          set +e
          node scripts/diagnostics/rugby_raw_fixture_index_graphql.mjs > docs/diagnostics/raw-fixture-index-run.log 2>&1
          code=$?
          echo "$code" > docs/diagnostics/raw-fixture-index-exit-code.txt
          cat > docs/diagnostics/raw-fixture-index-run.json <<EOF
          {"run_id":${GITHUB_RUN_ID},"commit":"${GITHUB_SHA}","exit_code":${code},"captured_at":"$(date -u +%FT%TZ)"}
          EOF
          exit 0
      - name: Commit fixture index/pointer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/diagnostics/raw-fixture-index-run.json docs/diagnostics/raw-fixture-index-run.log docs/diagnostics/raw-fixture-index-exit-code.txt
          if [ -f docs/diagnostics/raw-fixture-index-2017-2026.json ]; then git add -- docs/diagnostics/raw-fixture-index-2017-2026.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record raw acquisition fixture index"
          git push origin HEAD:probe/rugby-raw-backfill
