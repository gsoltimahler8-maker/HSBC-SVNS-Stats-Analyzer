name: Rugby Raw Backfill 2016-17 Men

on:
  push:
    branches:
      - probe/rugby-raw-backfill
    paths:
      - scripts/diagnostics/rugby_raw_backfill_2017_men.mjs
      - .github/workflows/rugby-raw-backfill-2017-men.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  OUT_DIR: artifacts/raw-2016-17-men

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/rugby-raw-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Acquire raw Rugby.com.au JSON
        id: acquire
        shell: bash
        run: |
          set +e
          mkdir -p docs/diagnostics
          node scripts/diagnostics/rugby_raw_backfill_2017_men.mjs > docs/diagnostics/raw-2016-17-men-acquisition.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "${code}" > docs/diagnostics/raw-2016-17-men-exit-code.txt
          exit 0
      - name: Record transport pointer
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          if [ -f artifacts/raw-2016-17-men/acquisition_summary.json ]; then
            cp artifacts/raw-2016-17-men/acquisition_summary.json docs/diagnostics/raw-2016-17-men-acquisition-summary.json
          fi
          cat > docs/diagnostics/raw-2016-17-men-run.json <<EOF
          {"run_id":${GITHUB_RUN_ID},"run_attempt":${GITHUB_RUN_ATTEMPT},"commit":"${GITHUB_SHA}","exit_code":${{ steps.acquire.outputs.exit_code }},"captured_at":"$(date -u +%FT%TZ)"}
          EOF
      - name: Upload immutable raw archive
        if: steps.acquire.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: rugby-raw-2016-17-men
          path: artifacts/raw-2016-17-men
          retention-days: 7
          if-no-files-found: error
      - name: Commit tiny acquisition pointers and diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/diagnostics/raw-2016-17-men-run.json docs/diagnostics/raw-2016-17-men-exit-code.txt docs/diagnostics/raw-2016-17-men-acquisition.log
          if [ -f docs/diagnostics/raw-2016-17-men-acquisition-summary.json ]; then git add -- docs/diagnostics/raw-2016-17-men-acquisition-summary.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record raw 2016-17 men acquisition result"
          git push origin HEAD:probe/rugby-raw-backfill
      - name: Fail after diagnostics if acquisition failed
        if: steps.acquire.outputs.exit_code != '0'
        run: exit 1
