name: Rugby Results Discovery Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_results_discovery_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe Rugby.com.au fixtures-results Next.js data
        env:
          OUT_DIR: artifacts/rugby-results-discovery-probe
        run: node scripts/diagnostics/rugby_results_discovery_probe.mjs

      - name: Show Results discovery summary
        if: always()
        run: |
          echo '--- fixtures-results discovery summary ---'
          cat artifacts/rugby-results-discovery-probe/summary.json || true

      - name: Upload Results discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-results-discovery-probe
          path: artifacts/rugby-results-discovery-probe/
          if-no-files-found: warn
          retention-days: 7
