name: Rugby Entity Season Minimal Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_entity_season_min_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entity-season-min:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run season-only EntityFixturesAndResults probe
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-entity-season-min
        run: |
          node scripts/diagnostics/rugby_entity_season_min_probe.mjs

      - name: Show Entity season probe summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-entity-season-min/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify(s, null, 2));
          NODE

      - name: Upload Entity season probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-entity-season-min
          path: artifacts/rugby-entity-season-min/
          if-no-files-found: warn
          retention-days: 14
