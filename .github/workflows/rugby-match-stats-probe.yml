name: Rugby Bordeaux 2026 Complete Data Audit

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_bordeaux_2026_complete_audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-bordeaux-complete-audit
          mkdir -p /tmp/rugby-bordeaux-complete-audit
          cp scripts/diagnostics/rugby_bordeaux_2026_complete_audit.mjs /tmp/rugby-bordeaux-complete-audit/audit.mjs
          cd /tmp/rugby-bordeaux-complete-audit
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Audit Bordeaux 2026 Women complete Match Centre data
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-bordeaux-2026-complete-audit
        run: |
          cd /tmp/rugby-bordeaux-complete-audit
          node audit.mjs

      - name: Show Bordeaux complete audit summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-bordeaux-2026-complete-audit/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            competitionId: s.competitionId,
            season: s.season,
            discoveredLinkCount: s.discoveredLinkCount,
            collectedCount: s.collectedCount,
            failureCount: s.failureCount,
            statsPresentCount: s.statsPresentCount,
            pointsSummaryPresentCount: s.pointsSummaryPresentCount,
            commentaryPresentCount: s.commentaryPresentCount,
            lineupPresentCount: s.lineupPresentCount,
            stagePotentialConflictCount: s.stagePotentialConflictCount,
            stagePotentialConflictFixtures: s.stagePotentialConflictFixtures,
            matchDataTopLevelKeys: s.matchDataTopLevelKeys,
            commentaryPathFrequency: s.commentaryPathFrequency,
            pointsSummaryPathFrequency: s.pointsSummaryPathFrequency,
            lineupPathFrequency: s.lineupPathFrequency,
            stagePathFrequency: s.stagePathFrequency,
            failures: s.failures
          }, null, 2));
          NODE
          echo '--- audit CSV sample ---'
          head -n 25 artifacts/rugby-bordeaux-2026-complete-audit/matches-audit.csv || true

      - name: Upload Bordeaux complete audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-bordeaux-2026-complete-audit
          path: artifacts/rugby-bordeaux-2026-complete-audit/
          if-no-files-found: warn
          retention-days: 14
