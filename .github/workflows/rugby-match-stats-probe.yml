name: Rugby Entity Page Crawl Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_entity_page_crawl_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entity-page-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-entity-page-crawl
          mkdir -p /tmp/rugby-entity-page-crawl
          cp scripts/diagnostics/rugby_entity_page_crawl_probe.mjs /tmp/rugby-entity-page-crawl/probe.mjs
          cd /tmp/rugby-entity-page-crawl
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Crawl entity pages and test season 2017
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-entity-page-crawl
        run: |
          cd /tmp/rugby-entity-page-crawl
          node probe.mjs

      - name: Show entity page crawl summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-entity-page-crawl/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            targetSeason: s.targetSeason,
            knownFixture: s.knownFixture,
            visitedPageCount: s.visitedPageCount,
            capturedEntityQueryCount: s.capturedEntityQueryCount,
            candidateCount: s.candidateCount,
            candidates: s.candidates,
            nonEmptyResultCount: s.nonEmptyResultCount,
            knownFixtureMatchCount: s.knownFixtureMatchCount,
            knownFixtureMatches: s.knownFixtureMatches,
            queryResults: s.queryResults,
            pagesWithEntityQueries: s.pagesWithEntityQueries,
            visitedPages: s.visitedPages
          }, null, 2));
          NODE

      - name: Upload entity page crawl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-entity-page-crawl
          path: artifacts/rugby-entity-page-crawl/
          if-no-files-found: warn
          retention-days: 14
