name: Rugby 2016-17 Men's Full Season Coverage

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_2017_mens_full_season_coverage_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mens-2017-full-season-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover remaining 2016-17 men's event seeds and audit full season coverage
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-2017-mens-full-season-coverage
        run: |
          node scripts/diagnostics/rugby_2017_mens_full_season_coverage_probe.mjs

      - name: Show 2016-17 men's full season coverage summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-2017-mens-full-season-coverage/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            canonicalSeriesSeason: s.canonicalSeriesSeason,
            sourceSeason: s.sourceSeason,
            officialEventCount: s.officialEventCount,
            discoveredEventCount: s.discoveredEventCount,
            reconstructedEventCount: s.reconstructedEventCount,
            completeEventCoverage: s.completeEventCoverage,
            reconstructedFixtureCount: s.reconstructedFixtureCount,
            richStatsCount: s.richStatsCount,
            sparseStatsCount: s.sparseStatsCount,
            scoreOnlyOrZeroStatsCount: s.scoreOnlyOrZeroStatsCount,
            noStatsCount: s.noStatsCount,
            analysisReadyCount: s.analysisReadyCount,
            analysisReadyFixtureRatio: s.analysisReadyFixtureRatio,
            seasonTrendEligibility: s.seasonTrendEligibility,
            discovery: s.discovery,
            eventSummary: s.eventSummary
          }, null, 2));
          NODE

      - name: Upload 2016-17 men's full season coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-2017-mens-full-season-coverage
          path: artifacts/rugby-2017-mens-full-season-coverage/
          if-no-files-found: warn
          retention-days: 14
