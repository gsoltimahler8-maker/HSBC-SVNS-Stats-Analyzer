name: Rugby Historical Coverage Matrix 2016-17 to 2025-26

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_historical_coverage_matrix.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-coverage-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-historical-coverage
          mkdir -p /tmp/rugby-historical-coverage
          cp scripts/diagnostics/rugby_historical_coverage_matrix.mjs /tmp/rugby-historical-coverage/audit.mjs
          cd /tmp/rugby-historical-coverage
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Audit all discoverable Series data from 2016-17 through 2025-26
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-historical-coverage-matrix
        run: |
          mkdir -p "$OUT_DIR"
          cd /tmp/rugby-historical-coverage
          set +e
          node audit.mjs > "$OUT_DIR/audit-console.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$OUT_DIR/exit-code.txt"
          tail -n 400 "$OUT_DIR/audit-console.log" > "$OUT_DIR/audit-console-tail.log" || true
          echo "Audit exit code: $code"

      - name: Show coverage summary or diagnostics
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = 'artifacts/rugby-historical-coverage-matrix';
          const p = `${base}/summary.json`;
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            if (fs.existsSync(`${base}/exit-code.txt`)) console.log('exit code:', fs.readFileSync(`${base}/exit-code.txt`, 'utf8').trim());
            if (fs.existsSync(`${base}/audit-console-tail.log`)) console.log(fs.readFileSync(`${base}/audit-console-tail.log`, 'utf8'));
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            hardBoundary: s.hardBoundary,
            latestCanonicalSeason: s.latestCanonicalSeason,
            baselineCanonicalSeason: s.baselineCanonicalSeason,
            targetCompetitionFilterCount: s.targetCompetitionFilterCount,
            discoveredFixtureCountWithinBoundary: s.discoveredFixtureCountWithinBoundary,
            detailSuccessCount: s.detailSuccessCount,
            detailFailureCount: s.detailFailureCount,
            discoveryFailureCount: s.discoveryFailureCount,
            seasonGenderRows: (s.seasonGenderRows || []).map(x => ({
              season: x.canonicalSeason,
              gender: x.gender,
              events: x.discoveredEventCount,
              fixtures: x.fixtureCount,
              detailSuccess: x.detailSuccessCount,
              rich: x.richStatsCount,
              sparse: x.sparseStatsCount,
              zero: x.scoreOnlyOrZeroStatsCount,
              noStats: x.noStatsCount,
              pointsSummary: `${x.pointsSummaryCount}/${x.detailSuccessCount}`,
              lineup: `${x.lineupCount}/${x.detailSuccessCount}`,
              commentary: `${x.commentaryCount}/${x.detailSuccessCount}`,
              allSeasonStat: `${x.allSeasonStatCount}/${x.detailSuccessCount}`,
              statSchemaVs2025_26: x.baselineComparison?.statTitles?.baselineCoverageRatio,
              fixtureSchemaVs2025_26: x.baselineComparison?.fixtureSchema?.baselineCoverageRatio,
              pointsSchemaVs2025_26: x.baselineComparison?.pointsSchema?.baselineCoverageRatio,
              lineupSchemaVs2025_26: x.baselineComparison?.lineupSchema?.baselineCoverageRatio,
              commentarySchemaVs2025_26: x.baselineComparison?.commentarySchema?.baselineCoverageRatio,
            })),
            otherMatchDataKeys: s.otherMatchDataKeys,
            allMatchStatsSummaryKeyFrequency: s.allMatchStatsSummaryKeyFrequency,
          }, null, 2));
          NODE

      - name: Persist compact audit results and diagnostics on probe branch
        if: always()
        run: |
          mkdir -p docs/diagnostics
          base='artifacts/rugby-historical-coverage-matrix'
          [ -f "$base/summary.json" ] && cp "$base/summary.json" docs/diagnostics/rugby-historical-coverage-summary.json || true
          [ -f "$base/coverage-matrix.csv" ] && cp "$base/coverage-matrix.csv" docs/diagnostics/rugby-historical-coverage-matrix.csv || true
          [ -f "$base/event-coverage.csv" ] && cp "$base/event-coverage.csv" docs/diagnostics/rugby-historical-event-coverage.csv || true
          [ -f "$base/other-match-data-keys.json" ] && cp "$base/other-match-data-keys.json" docs/diagnostics/rugby-historical-other-match-data-keys.json || true
          [ -f "$base/exit-code.txt" ] && cp "$base/exit-code.txt" docs/diagnostics/rugby-historical-audit-exit-code.txt || true
          [ -f "$base/audit-console-tail.log" ] && cp "$base/audit-console-tail.log" docs/diagnostics/rugby-historical-audit-console-tail.log || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          paths=(
            docs/diagnostics/rugby-historical-coverage-summary.json
            docs/diagnostics/rugby-historical-coverage-matrix.csv
            docs/diagnostics/rugby-historical-event-coverage.csv
            docs/diagnostics/rugby-historical-other-match-data-keys.json
            docs/diagnostics/rugby-historical-audit-exit-code.txt
            docs/diagnostics/rugby-historical-audit-console-tail.log
          )
          for p in "${paths[@]}"; do [ -f "$p" ] && git add -- "$p"; done
          if git diff --cached --quiet; then
            echo 'No audit result changes to commit.'
          else
            git commit -m 'Record historical coverage audit results'
            git push origin HEAD:probe/rugby-match-stats
          fi

      - name: Upload historical coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-historical-coverage-matrix-2016-17-to-2025-26
          path: artifacts/rugby-historical-coverage-matrix/
          if-no-files-found: warn
          retention-days: 14
