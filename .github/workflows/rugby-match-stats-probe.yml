name: Rugby Legacy Sevens Coverage Discovery

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_legacy_sevens_discovery_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-legacy-sevens-discovery
          mkdir -p /tmp/rugby-legacy-sevens-discovery
          cp scripts/diagnostics/rugby_legacy_sevens_discovery_probe.mjs /tmp/rugby-legacy-sevens-discovery/probe.mjs
          cd /tmp/rugby-legacy-sevens-discovery
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Probe legacy World Rugby Sevens Series discovery routes
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-legacy-sevens-discovery
        run: |
          cd /tmp/rugby-legacy-sevens-discovery
          node probe.mjs

      - name: Show legacy discovery summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-legacy-sevens-discovery/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            seed: s.seed,
            sitemapProbe: s.sitemapProbe,
            variants: (s.variants || []).map(v => ({
              name: v.name,
              ok: v.ok,
              linkCount: v.linkCount,
              seasons: v.seasons,
              legacyLinkCount: v.legacyLinkCount,
              snapshots: v.snapshots,
              error: v.error
            })),
            graphqlRequestCount: s.graphqlRequestCount,
            graphql: (s.graphql || []).map(g => ({
              index: g.index,
              variant: g.variant,
              variableKeys: g.variableKeys,
              variables: g.variables,
              queryRelevantLines: g.queryRelevantLines
            })),
            discoveredLegacyLinkCount: s.discoveredLegacyLinkCount,
            legacySeasons: s.legacySeasons,
            legacyCompetitions: s.legacyCompetitions,
            oldestLegacyLinks: s.oldestLegacyLinks
          }, null, 2));
          NODE

      - name: Upload legacy discovery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-legacy-sevens-discovery
          path: artifacts/rugby-legacy-sevens-discovery/
          if-no-files-found: warn
          retention-days: 14
