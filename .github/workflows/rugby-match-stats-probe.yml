name: Rugby Match Stats Direct Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_match_stats_direct_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Direct probe of three Japan Women 7s fixtures
        env:
          OUT_DIR: artifacts/rugby-match-stats-direct-probe
        run: node scripts/diagnostics/rugby_match_stats_direct_probe.mjs

      - name: Show direct-probe summary
        if: always()
        run: |
          echo '--- direct Next.js JSON probe summary ---'
          cat artifacts/rugby-match-stats-direct-probe/summary.json || true
          echo '--- generated files ---'
          find artifacts/rugby-match-stats-direct-probe -maxdepth 1 -type f -printf '%f\n' | sort || true
          echo '--- first CSV rows ---'
          head -n 20 artifacts/rugby-match-stats-direct-probe/japan-women-7s-sample-stats.csv || true

      - name: Upload direct probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-match-stats-direct-probe-3-fixtures
          path: artifacts/rugby-match-stats-direct-probe/
          if-no-files-found: warn
          retention-days: 7
