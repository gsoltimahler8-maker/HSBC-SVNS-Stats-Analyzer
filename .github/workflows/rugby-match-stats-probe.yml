name: Rugby Results Network Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_results_network_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-results-network-probe
          mkdir -p /tmp/rugby-results-network-probe
          cp scripts/diagnostics/rugby_results_network_probe.mjs /tmp/rugby-results-network-probe/probe.mjs
          cd /tmp/rugby-results-network-probe
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Probe fixtures-results network traffic
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-results-network-probe
        run: |
          cd /tmp/rugby-results-network-probe
          node probe.mjs

      - name: Show Results network summary
        if: always()
        run: |
          echo '--- Results network summary ---'
          cat artifacts/rugby-results-network-probe/summary.json || true
          echo '--- candidate body files ---'
          find artifacts/rugby-results-network-probe -maxdepth 1 -type f -name 'candidate-*.txt' -printf '%f\n' | sort || true

      - name: Upload Results network artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-results-network-probe
          path: artifacts/rugby-results-network-probe/
          if-no-files-found: warn
          retention-days: 7
