name: Rugby Legacy Fixture Neighborhood

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_legacy_fixture_neighborhood_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-fixture-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Node environment
        run: |
          rm -rf /tmp/rugby-legacy-fixture-neighborhood
          mkdir -p /tmp/rugby-legacy-fixture-neighborhood
          cp scripts/diagnostics/rugby_legacy_fixture_neighborhood_probe.mjs /tmp/rugby-legacy-fixture-neighborhood/probe.mjs
          cd /tmp/rugby-legacy-fixture-neighborhood
          printf '{"private":true,"type":"module"}\n' > package.json

      - name: Reconstruct Hong Kong 2017 by neighboring fixture IDs
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-legacy-fixture-neighborhood
        run: |
          cd /tmp/rugby-legacy-fixture-neighborhood
          node probe.mjs

      - name: Show legacy fixture neighborhood summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-legacy-fixture-neighborhood/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            seed: s.seed,
            scanRadiusUsed: s.scanRadiusUsed,
            scanMinFixtureId: s.scanMinFixtureId,
            scanMaxFixtureId: s.scanMaxFixtureId,
            scannedCandidateCount: s.scannedCandidateCount,
            kindCounts: s.kindCounts,
            httpStatusCounts: s.httpStatusCounts,
            reconstructedFixtureCount: s.reconstructedFixtureCount,
            minMatchedFixtureId: s.minMatchedFixtureId,
            maxMatchedFixtureId: s.maxMatchedFixtureId,
            firstDateTime: s.firstDateTime,
            lastDateTime: s.lastDateTime,
            uniqueTeamCount: s.uniqueTeamCount,
            teams: s.teams,
            roundCounts: s.roundCounts,
            statsPresentCount: s.statsPresentCount,
            commentaryPresentCount: s.commentaryPresentCount,
            pointsSummaryPresentCount: s.pointsSummaryPresentCount,
            lineupPresentCount: s.lineupPresentCount,
            fixtureIds: s.fixtureIds,
            firstFixtures: s.firstFixtures,
            lastFixtures: s.lastFixtures
          }, null, 2));
          NODE
          echo '--- reconstructed fixture CSV ---'
          head -n 60 artifacts/rugby-legacy-fixture-neighborhood/hong-kong-2017-fixtures.csv || true

      - name: Upload legacy fixture neighborhood artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-legacy-fixture-neighborhood
          path: artifacts/rugby-legacy-fixture-neighborhood/
          if-no-files-found: warn
          retention-days: 14
