name: Rugby Japan Women Bulk Collect

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_japan_women_bulk_collect.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bulk-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-japan-women-bulk
          mkdir -p /tmp/rugby-japan-women-bulk
          cp scripts/diagnostics/rugby_japan_women_bulk_collect.mjs /tmp/rugby-japan-women-bulk/collect.mjs
          cd /tmp/rugby-japan-women-bulk
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Collect Japan Women 7s Results and Match Stats
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-japan-women-bulk-collect
        run: |
          cd /tmp/rugby-japan-women-bulk
          node collect.mjs

      - name: Show bulk collection summary
        if: always()
        run: |
          echo '--- bulk collection summary ---'
          cat artifacts/rugby-japan-women-bulk-collect/summary.json || true
          echo '--- matches.csv ---'
          head -n 25 artifacts/rugby-japan-women-bulk-collect/matches.csv || true
          echo '--- stats-long.csv sample ---'
          head -n 30 artifacts/rugby-japan-women-bulk-collect/stats-long.csv || true

      - name: Upload bulk collection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-japan-women-bulk-collect
          path: artifacts/rugby-japan-women-bulk-collect/
          if-no-files-found: warn
          retention-days: 7
