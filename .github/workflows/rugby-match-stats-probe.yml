name: Rugby Legacy Sevens GraphQL Pagination

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_legacy_graphql_pagination_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-graphql-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-legacy-graphql-pagination
          mkdir -p /tmp/rugby-legacy-graphql-pagination
          cp scripts/diagnostics/rugby_legacy_graphql_pagination_probe.mjs /tmp/rugby-legacy-graphql-pagination/probe.mjs
          cd /tmp/rugby-legacy-graphql-pagination
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Enumerate historical Sevens fixtures via direct GraphQL pagination
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-legacy-graphql-pagination
        run: |
          cd /tmp/rugby-legacy-graphql-pagination
          node probe.mjs

      - name: Show legacy GraphQL pagination summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-legacy-graphql-pagination/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            targetCompetitionCount: s.targetCompetitionCount,
            totalUniqueFixtureCount: s.totalUniqueFixtureCount,
            sourceSeasons: s.sourceSeasons,
            oldestSourceSeason: s.oldestSourceSeason,
            newestSourceSeason: s.newestSourceSeason,
            legacyFixtureCountBefore2023: s.legacyFixtureCountBefore2023,
            legacyCompetitionCountBefore2023: s.legacyCompetitionCountBefore2023,
            legacyCompetitionSummaries: s.legacyCompetitionSummaries,
            oldestFixturesOverall: s.oldestFixturesOverall,
            responseShapes: s.responseShapes,
            failureCount: s.failureCount,
            failures: s.failures
          }, null, 2));
          NODE
          echo '--- legacy fixtures CSV head ---'
          head -n 30 artifacts/rugby-legacy-graphql-pagination/legacy-graphql-fixtures.csv || true

      - name: Upload legacy GraphQL pagination artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-legacy-graphql-pagination
          path: artifacts/rugby-legacy-graphql-pagination/
          if-no-files-found: warn
          retention-days: 14
