name: Rugby Bordeaux 2026 Schema Refinement

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_bordeaux_2026_schema_refinement_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-bordeaux-schema-refinement
          mkdir -p /tmp/rugby-bordeaux-schema-refinement
          cp scripts/diagnostics/rugby_bordeaux_2026_schema_refinement_probe.mjs /tmp/rugby-bordeaux-schema-refinement/probe.mjs
          cd /tmp/rugby-bordeaux-schema-refinement
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Audit exact Commentary Points Summary and Lineup record shapes
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-bordeaux-2026-schema-refinement
        run: |
          cd /tmp/rugby-bordeaux-schema-refinement
          node probe.mjs

      - name: Show schema refinement summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-bordeaux-2026-schema-refinement/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          const compact = (x) => ({
            rootTypes: x?.rootTypes,
            bestCandidates: (x?.bestCandidates || []).map(c => ({
              path: c.path,
              fixtureCount: c.fixtureCount,
              totalElements: c.totalElements,
              objectElements: c.objectElements,
              candidateScore: c.candidateScore,
              topSignatures: c.topSignatures,
              scalarKeyFrequency: c.scalarKeyFrequency
            }))
          });
          console.log(JSON.stringify({
            audit: s.audit,
            competitionId: s.competitionId,
            season: s.season,
            discoveredLinkCount: s.discoveredLinkCount,
            collectedCount: s.collectedCount,
            failureCount: s.failureCount,
            commentary: compact(s.commentary),
            pointsSummary: compact(s.pointsSummary),
            lineup: compact(s.lineup),
            failures: s.failures
          }, null, 2));
          NODE

      - name: Upload schema refinement artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-bordeaux-2026-schema-refinement
          path: artifacts/rugby-bordeaux-2026-schema-refinement/
          if-no-files-found: warn
          retention-days: 14
