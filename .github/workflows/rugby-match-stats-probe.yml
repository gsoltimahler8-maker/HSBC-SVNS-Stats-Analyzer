name: Rugby Bordeaux 2026 Canonical CSV Export

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_bordeaux_2026_canonical_export.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-bordeaux-canonical-export
          mkdir -p /tmp/rugby-bordeaux-canonical-export
          cp scripts/diagnostics/rugby_bordeaux_2026_canonical_export.mjs /tmp/rugby-bordeaux-canonical-export/export.mjs
          cd /tmp/rugby-bordeaux-canonical-export
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Export Bordeaux 2026 Women raw JSON and analysis CSVs
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-bordeaux-2026-canonical-export
        run: |
          cd /tmp/rugby-bordeaux-canonical-export
          node export.mjs

      - name: Show canonical export summary
        if: always()
        run: |
          echo '--- canonical export summary ---'
          cat artifacts/rugby-bordeaux-2026-canonical-export/summary.json || true
          echo '--- matches.csv ---'
          head -n 6 artifacts/rugby-bordeaux-2026-canonical-export/matches.csv || true
          echo '--- team_match_stats.csv header/sample ---'
          head -n 4 artifacts/rugby-bordeaux-2026-canonical-export/team_match_stats.csv || true
          echo '--- points_summary.csv sample ---'
          head -n 6 artifacts/rugby-bordeaux-2026-canonical-export/points_summary.csv || true
          echo '--- commentary.csv sample ---'
          head -n 6 artifacts/rugby-bordeaux-2026-canonical-export/commentary.csv || true
          echo '--- lineups.csv sample ---'
          head -n 6 artifacts/rugby-bordeaux-2026-canonical-export/lineups.csv || true

      - name: Upload canonical export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-bordeaux-2026-canonical-export
          path: artifacts/rugby-bordeaux-2026-canonical-export/
          if-no-files-found: warn
          retention-days: 14
