name: Rugby Entity Season clubSiteMeta Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_entity_season_clubmeta_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  entity-season-clubmeta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract clubSiteMeta candidates and query season 2017
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-entity-season-clubmeta
        run: |
          node scripts/diagnostics/rugby_entity_season_clubmeta_probe.mjs

      - name: Show clubSiteMeta entity season probe summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-entity-season-clubmeta/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            targetSeason: s.targetSeason,
            knownFixture: s.knownFixture,
            candidateCount: s.candidateCount,
            candidates: s.candidates,
            nonEmptyResultCount: s.nonEmptyResultCount,
            knownFixtureMatchCount: s.knownFixtureMatchCount,
            queryResults: s.queryResults,
            pageReports: s.pageReports
          }, null, 2));
          NODE

      - name: Upload clubSiteMeta entity season probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-entity-season-clubmeta
          path: artifacts/rugby-entity-season-clubmeta/
          if-no-files-found: warn
          retention-days: 14
