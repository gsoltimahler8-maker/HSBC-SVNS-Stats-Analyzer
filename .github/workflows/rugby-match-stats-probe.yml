name: Rugby Pre-2023 Season Coverage and API Discovery

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_pre2023_season_coverage_api_discovery.mjs'
      - 'scripts/diagnostics/legacy-sevens-seed-catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre2023-season-coverage-api-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-pre2023-season-coverage-api-discovery
          mkdir -p /tmp/rugby-pre2023-season-coverage-api-discovery
          cp scripts/diagnostics/rugby_pre2023_season_coverage_api_discovery.mjs /tmp/rugby-pre2023-season-coverage-api-discovery/probe.mjs
          cp scripts/diagnostics/legacy-sevens-seed-catalog.json /tmp/rugby-pre2023-season-coverage-api-discovery/legacy-sevens-seed-catalog.json
          cd /tmp/rugby-pre2023-season-coverage-api-discovery
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Discover season/year API routes and audit observed pre-2023 coverage
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-pre2023-season-coverage-api-discovery
          CATALOG_PATH: /tmp/rugby-pre2023-season-coverage-api-discovery/legacy-sevens-seed-catalog.json
        run: |
          cd /tmp/rugby-pre2023-season-coverage-api-discovery
          node probe.mjs

      - name: Show pre-2023 season coverage and API discovery summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-pre2023-season-coverage-api-discovery/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            legacySeedCount: s.legacySeedCount,
            apiDiscovery: {
              capturedGraphQlRequestCount: s.apiDiscovery?.capturedGraphQlRequestCount,
              fixturesAndResultsCaptured: s.apiDiscovery?.fixturesAndResultsCaptured,
              fixturesAndResultsVariables: s.apiDiscovery?.fixturesAndResultsVariables,
              fixturesAndResultsQueryRelevantLines: s.apiDiscovery?.fixturesAndResultsQueryRelevantLines,
              urlVariants: s.apiDiscovery?.urlVariants,
              scriptCount: s.apiDiscovery?.scriptCount,
              bundleReportCount: s.apiDiscovery?.bundleReportCount,
              bundleReports: s.apiDiscovery?.bundleReports,
              introspection: s.apiDiscovery?.introspection
            },
            eventSummary: s.eventSummary,
            seasonCoverageObserved: s.seasonCoverageObserved,
            note: s.note
          }, null, 2));
          NODE

      - name: Upload pre-2023 season coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-pre2023-season-coverage-api-discovery
          path: artifacts/rugby-pre2023-season-coverage-api-discovery/
          if-no-files-found: warn
          retention-days: 14
