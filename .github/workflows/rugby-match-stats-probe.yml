name: Rugby Results Pagination Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_results_pagination_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagination-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-results-pagination
          mkdir -p /tmp/rugby-results-pagination
          cp scripts/diagnostics/rugby_results_pagination_probe.mjs /tmp/rugby-results-pagination/probe.mjs
          cd /tmp/rugby-results-pagination
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Probe Results pagination and GraphQL variables
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-results-pagination-probe
        run: |
          cd /tmp/rugby-results-pagination
          node probe.mjs

      - name: Show pagination summary
        if: always()
        run: |
          echo '--- Results pagination summary ---'
          cat artifacts/rugby-results-pagination-probe/summary.json || true

      - name: Upload pagination probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-results-pagination-probe
          path: artifacts/rugby-results-pagination-probe/
          if-no-files-found: warn
          retention-days: 7
