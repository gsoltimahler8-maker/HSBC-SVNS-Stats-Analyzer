name: Rugby Match Stats Probe

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_match_stats_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-probe
          mkdir -p /tmp/rugby-probe
          cp scripts/diagnostics/rugby_match_stats_probe.mjs /tmp/rugby-probe/probe.mjs
          cd /tmp/rugby-probe
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Probe Rugby.com.au Match Stats
        env:
          TARGET_URL: https://www.rugby.com.au/match-centre/112/2026/951419?tab=Match-Stats
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-match-stats-probe
        run: |
          cd /tmp/rugby-probe
          node probe.mjs

      - name: Show summary
        if: always()
        run: |
          echo '--- summary.json ---'
          cat artifacts/rugby-match-stats-probe/summary.json || true
          echo '--- Next.js match-data summary ---'
          cat artifacts/rugby-match-stats-probe/next-data-summary.json || true
          echo '--- Next.js stat inspection (condensed) ---'
          node - <<'NODE'
          const fs = require('fs');
          const dir = 'artifacts/rugby-match-stats-probe';
          if (!fs.existsSync(dir)) process.exit(0);
          for (const name of fs.readdirSync(dir).filter(x => x.endsWith('-inspection.json'))) {
            const x = JSON.parse(fs.readFileSync(`${dir}/${name}`, 'utf8'));
            console.log('FILE', name);
            console.log('statKeyPaths', JSON.stringify(x.statKeyPaths || [], null, 2));
            console.log('statValueHits', JSON.stringify((x.statValueHits || []).slice(0, 20), null, 2));
            console.log('likelyContainers', JSON.stringify((x.likelyContainers || []).slice(0, 12), null, 2));
          }
          NODE
          echo '--- candidate network URLs ---'
          node -e "const fs=require('fs'); const p='artifacts/rugby-match-stats-probe/network-candidates.json'; if(fs.existsSync(p)){for(const x of JSON.parse(fs.readFileSync(p,'utf8'))) console.log(x.status, x.resourceType, x.url)}"

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-match-stats-probe-951419
          path: artifacts/rugby-match-stats-probe/
          if-no-files-found: warn
          retention-days: 7
