name: Rugby Legacy Hong Kong 2016 Quality

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_legacy_hongkong_2016_quality_probe.mjs'
      - 'scripts/diagnostics/legacy-sevens-seed-catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-hongkong-2016-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Node environment
        run: |
          rm -rf /tmp/rugby-legacy-hongkong-2016-quality
          mkdir -p /tmp/rugby-legacy-hongkong-2016-quality
          cp scripts/diagnostics/rugby_legacy_hongkong_2016_quality_probe.mjs /tmp/rugby-legacy-hongkong-2016-quality/probe.mjs
          cp scripts/diagnostics/legacy-sevens-seed-catalog.json /tmp/rugby-legacy-hongkong-2016-quality/legacy-sevens-seed-catalog.json
          cd /tmp/rugby-legacy-hongkong-2016-quality
          printf '{"private":true,"type":"module"}\n' > package.json

      - name: Reconstruct Hong Kong 2016 and audit effective stats density
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-legacy-hongkong-2016-quality
          CATALOG_PATH: /tmp/rugby-legacy-hongkong-2016-quality/legacy-sevens-seed-catalog.json
        run: |
          cd /tmp/rugby-legacy-hongkong-2016-quality
          node probe.mjs

      - name: Show Hong Kong 2016 legacy quality summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-legacy-hongkong-2016-quality/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            seed: s.seed,
            scannedCandidateCount: s.scannedCandidateCount,
            scanMinFixtureId: s.scanMinFixtureId,
            scanMaxFixtureId: s.scanMaxFixtureId,
            kindCounts: s.kindCounts,
            reconstructedFixtureCount: s.reconstructedFixtureCount,
            minMatchedFixtureId: s.minMatchedFixtureId,
            maxMatchedFixtureId: s.maxMatchedFixtureId,
            firstDateTime: s.firstDateTime,
            lastDateTime: s.lastDateTime,
            uniqueTeamCount: s.uniqueTeamCount,
            roundCounts: s.roundCounts,
            statsPresentCount: s.statsPresentCount,
            statsQualityCounts: s.statsQualityCounts,
            richStatsCount: s.richStatsCount,
            sparseStatsCount: s.sparseStatsCount,
            scoreOnlyOrZeroStatsCount: s.scoreOnlyOrZeroStatsCount,
            commentaryPresentCount: s.commentaryPresentCount,
            pointsSummaryPresentCount: s.pointsSummaryPresentCount,
            lineupPresentCount: s.lineupPresentCount,
            lowestCoreDensityFixtures: s.lowestCoreDensityFixtures
          }, null, 2));
          NODE

      - name: Upload Hong Kong 2016 quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-legacy-hongkong-2016-quality
          path: artifacts/rugby-legacy-hongkong-2016-quality/
          if-no-files-found: warn
          retention-days: 14
