name: Rugby SVNS Coverage Inventory

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_svns_coverage_inventory.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-svns-coverage-inventory
          mkdir -p /tmp/rugby-svns-coverage-inventory
          cp scripts/diagnostics/rugby_svns_coverage_inventory.mjs /tmp/rugby-svns-coverage-inventory/inventory.mjs
          cd /tmp/rugby-svns-coverage-inventory
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Inventory discoverable World Rugby Sevens Series and HSBC SVNS coverage
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-svns-coverage-inventory
        run: |
          cd /tmp/rugby-svns-coverage-inventory
          node inventory.mjs

      - name: Show coverage inventory summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-svns-coverage-inventory/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            competitionFilterCandidateCount: s.competitionFilterCandidateCount,
            seriesTargetCompetitionCount: s.seriesTargetCompetitionCount,
            inventoryRowCount: s.inventoryRowCount,
            checkedEditionCount: s.checkedEditionCount,
            withMatchStatsCount: s.withMatchStatsCount,
            withCommentaryCount: s.withCommentaryCount,
            withPointsSummaryCount: s.withPointsSummaryCount,
            withLineupCount: s.withLineupCount,
            oldestSourceSeason: s.oldestSourceSeason,
            newestSourceSeason: s.newestSourceSeason,
            sourceSeasons: s.sourceSeasons,
            oldestCheckedEditions: s.oldestCheckedEditions,
            noStatsEditions: s.noStatsEditions,
            noResultsLinkCompetitions: s.noResultsLinkCompetitions,
            failureCount: s.failureCount,
            failures: s.failures
          }, null, 2));
          NODE
          echo '--- coverage inventory CSV head ---'
          head -n 30 artifacts/rugby-svns-coverage-inventory/svns-coverage-inventory.csv || true

      - name: Upload coverage inventory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-svns-coverage-inventory
          path: artifacts/rugby-svns-coverage-inventory/
          if-no-files-found: warn
          retention-days: 14
