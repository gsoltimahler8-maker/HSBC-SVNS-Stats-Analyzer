name: Rugby Legacy Sevens Team Pivot

on:
  push:
    branches:
      - probe/rugby-match-stats
    paths:
      - '.github/workflows/rugby-match-stats-probe.yml'
      - 'scripts/diagnostics/rugby_legacy_team_pivot_probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-team-pivot:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated Playwright environment
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          rm -rf /tmp/rugby-legacy-team-pivot
          mkdir -p /tmp/rugby-legacy-team-pivot
          cp scripts/diagnostics/rugby_legacy_team_pivot_probe.mjs /tmp/rugby-legacy-team-pivot/probe.mjs
          cd /tmp/rugby-legacy-team-pivot
          printf '{"private":true,"type":"module"}\n' > package.json
          pnpm add playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Discover legacy Sevens fixtures via team IDs and sourceType variants
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts/rugby-legacy-team-pivot
        run: |
          cd /tmp/rugby-legacy-team-pivot
          node probe.mjs

      - name: Show legacy team pivot summary
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'artifacts/rugby-legacy-team-pivot/summary.json';
          if (!fs.existsSync(p)) {
            console.log('summary.json not found');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify({
            audit: s.audit,
            seed: s.seed,
            seedTeams: s.seedTeams,
            teamPivots: (s.teamPivots || []).map(x => ({
              team: x.team,
              totalFixtureCount: x.totalFixtureCount,
              sevensLikeFixtureCount: x.sevensLikeFixtureCount,
              sourceSeasons: x.sourceSeasons,
              oldestSourceSeason: x.oldestSourceSeason,
              legacyFixtureCountBefore2023: x.legacyFixtureCountBefore2023,
              legacySevensFixtureCountBefore2023: x.legacySevensFixtureCountBefore2023,
              legacyCompetitionIds: x.legacyCompetitionIds,
              oldestLegacySevensFixtures: x.oldestLegacySevensFixtures
            })),
            sourceTypeVariants: (s.sourceTypeVariants || []).map(x => ({
              sourceType: x.sourceType,
              fixtureCount: x.fixtureCount,
              sourceSeasons: x.sourceSeasons,
              legacyFixtureCountBefore2023: x.legacyFixtureCountBefore2023,
              oldestLegacyFixtures: x.oldestLegacyFixtures
            })),
            uniqueTeamPivotFixtureCount: s.uniqueTeamPivotFixtureCount,
            legacySevensFixtureCountBefore2023: s.legacySevensFixtureCountBefore2023,
            legacySeasons: s.legacySeasons,
            legacyCompetitionIds: s.legacyCompetitionIds,
            discoveredLegacyTeamIdCount: s.discoveredLegacyTeamIdCount,
            discoveredLegacyTeamIds: s.discoveredLegacyTeamIds,
            oldestLegacySevensFixtures: s.oldestLegacySevensFixtures,
            failureCount: s.failureCount,
            failures: s.failures
          }, null, 2));
          NODE
          echo '--- team pivot fixture CSV head ---'
          head -n 40 artifacts/rugby-legacy-team-pivot/team-pivot-fixtures.csv || true

      - name: Upload legacy team pivot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugby-legacy-team-pivot
          path: artifacts/rugby-legacy-team-pivot/
          if-no-files-found: warn
          retention-days: 14
