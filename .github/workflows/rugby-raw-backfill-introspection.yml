name: Rugby Raw Backfill Endpoint Introspection

on:
  push:
    branches:
      - probe/rugby-raw-backfill
    paths:
      - scripts/diagnostics/rugby_raw_endpoint_introspection.mjs
      - .github/workflows/rugby-raw-backfill-introspection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/rugby-raw-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Introspect Rugby AU GraphQL fixture surface
        run: node scripts/diagnostics/rugby_raw_endpoint_introspection.mjs
      - name: Record run pointer
        run: |
          mkdir -p docs/diagnostics
          cat > docs/diagnostics/raw-backfill-introspection-run.json <<EOF
          {"run_id":${GITHUB_RUN_ID},"run_attempt":${GITHUB_RUN_ATTEMPT},"commit":"${GITHUB_SHA}","captured_at":"$(date -u +%FT%TZ)"}
          EOF
      - name: Commit tiny diagnostic output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/diagnostics/raw-backfill-introspection.json docs/diagnostics/raw-backfill-introspection-run.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record raw backfill endpoint introspection"
          git push origin HEAD:probe/rugby-raw-backfill
