name: Rugby Raw Competition Index
on:
  push:
    branches: [probe/rugby-raw-backfill]
    paths:
      - scripts/diagnostics/rugby_raw_competition_index.mjs
      - .github/workflows/rugby-raw-competition-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe/rugby-raw-backfill}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/diagnostics/rugby_raw_competition_index.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/diagnostics/raw-sevens-competition-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Sevens competition index"
          git push origin HEAD:probe/rugby-raw-backfill
